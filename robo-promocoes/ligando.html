<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ligando o robô…</title>
<style>
  html { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #ecebf2; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box;
         background: radial-gradient(700px 420px at 50% -10%, rgba(255,46,151,.18), transparent 65%), #0a0a0f; }
  .caixa { background: #13131b; border: 1px solid #24242f; padding: 34px 40px; border-radius: 20px; text-align: center; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .roda { width: 44px; height: 44px; border: 3px solid #33333f; border-top-color: #ff2e97; border-radius: 50%; margin: 0 auto 18px; animation: g 1s linear infinite; filter: drop-shadow(0 0 8px rgba(255,46,151,.6)); }
  @keyframes g { to { transform: rotate(360deg); } }
  h2 { margin: 0 0 8px; }
  p { color: #8b8a99; margin: 0 0 8px; }
  small { color: #5c5b6b; }
  b { color: #ff5cb0; }
</style>
</head>
<body>
<div class="caixa">
  <div class="roda"></div>
  <h2>Ligando o robô…</h2>
  <p id="msg">Isso leva uns segundos. O painel abre sozinho.</p>
  <small>Pode deixar esta aba aberta.</small>
</div>
<script>
  const inicio = Date.now();
  async function tentar() {
    try {
      await fetch('http://localhost:3000/api/estado', { mode: 'no-cors', cache: 'no-store' });
      location.href = 'http://localhost:3000';
      return;
    } catch {}
    const seg = (Date.now() - inicio) / 1000;
    if (seg > 120) {
      document.getElementById('msg').innerHTML =
        'Está demorando mais que o normal. Confira o arquivo <b>dados\\robo.log</b> na pasta do robô para ver o erro.';
    }
    setTimeout(tentar, 1500);
  }
  tentar();
</script>
</body>
</html>
