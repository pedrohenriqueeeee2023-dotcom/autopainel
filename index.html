    <!-- Meta Pixel: o ID vem da variável VITE_META_PIXEL_ID (Vercel > Settings > Environment Variables).
         Sem a variável, o Pixel não carrega. O evento Lead fica em src/analytics.js. -->
    <script>

          n.loaded = !0;
          n.version = '2.0';
          n.queue = [];

          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '%VITE_META_PIXEL_ID%');

      }
